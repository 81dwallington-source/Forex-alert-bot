name: Forex Bot 3 — Independent

on:
  pull_request:
    paths:
      - 'bot3/**'
      - '.github/workflows/forex-bot-3.yml'
  push:
    branches:
      - 'bot3-independent-build-v2'
    paths:
      - 'bot3/**'
      - '.github/workflows/forex-bot-3.yml'
  workflow_dispatch:
  schedule:
    - cron: "0 * * * 1-5"

concurrency:
  group: forex-bot-3-independent-${{ github.event_name }}
  cancel-in-progress: false
permissions:
  contents: write

jobs:
  bot3:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Regression tests
        run: python -m unittest -v bot3.test_bot3
      - name: Run independent scans
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          cycles=1
          if [ "$GITHUB_EVENT_NAME" = "schedule" ]; then cycles=12; fi
          failures=0
          for cycle in $(seq 1 "$cycles"); do
            echo "Bot 3 scan $cycle/$cycles"
            if ! python -m bot3.bot3; then failures=$((failures + 1)); fi
            if [ "$cycle" -lt "$cycles" ]; then sleep 300; fi
          done
          if [ "$failures" -gt 0 ]; then exit 1; fi
      - name: Verify Bot 3 Telegram delivery
        if: github.event_name == 'push' && github.sha == '05060799d65efb5e2bbba7683fa0b2c6e01b5a57'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import os, requests
          token = os.environ["TELEGRAM_BOT_TOKEN"]
          chat_id = os.environ["TELEGRAM_CHAT_ID"]
          response = requests.post(
              f"https://api.telegram.org/bot{token}/sendMessage",
              json={"chat_id": chat_id,
                    "text": "BOT 3 CONNECTION TEST — Telegram delivery confirmed. This is a test, not a trade signal."},
              timeout=20,
          )
          response.raise_for_status()
          if not response.json().get("ok"):
              raise SystemExit("Telegram rejected Bot 3 connection test")
          print("Bot 3 Telegram delivery confirmed")
          PY
      - name: Save Bot 3 state and signal log
        if: always() && (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule')
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bot3_state.json bot3_signal_log.csv 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "Save Bot 3 independent signal state [skip ci]"
            git push origin HEAD:"$GITHUB_REF_NAME"
          fi
