name: Forex Liquidity Sweep Bot

on:
  push:
    branches: [main]
    paths:
      - 'liquidity_sweep_bot.py'
      - 'test_liquidity_sweep_bot.py'
      - '.github/workflows/liquidity-sweep-bot.yml'
  workflow_dispatch:
  schedule:
    # Start an hourly worker; Python enforces the UK-local 05:00-23:00 window (GMT/BST aware).
    - cron: "0 * * * *"

# Never overlap workers: Bot 2 keeps its daily alert state in the runner
# during the hour and publishes the state/history before the worker exits.
concurrency:
  group: forex-liquidity-sweep-bot
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run-liquidity-sweep-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Offline regression tests
        run: python -m unittest -v test_liquidity_sweep_bot.py

      - name: Run twelve five-minute liquidity scans
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          failures=0
          cycles=12
          for cycle in $(seq 1 "$cycles"); do
            started=$(date +%s)
            echo "Forex Liquidity Sweep Bot scan $cycle/$cycles"
            if ! python liquidity_sweep_bot.py; then
              failures=$((failures + 1))
              echo "Scan $cycle failed; continuing to the next five-minute cycle"
            fi
            if [ "$cycle" -lt "$cycles" ]; then
              elapsed=$(( $(date +%s) - started ))
              delay=$((300 - elapsed))
              if [ "$delay" -gt 0 ]; then sleep "$delay"; fi
            fi
          done
          if [ "$failures" -gt 0 ]; then
            echo "$failures liquidity scan cycle(s) failed"
            exit 1
          fi

      - name: Save Bot 2 state and history
        if: always() && github.ref == 'refs/heads/main'
        continue-on-error: true
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p /tmp/sweep-snapshot
          for f in liquidity_sweep_state.json liquidity_sweep_log.csv; do
            if [ -f "$f" ]; then cp "$f" "/tmp/sweep-snapshot/$f"; fi
          done
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            for f in liquidity_sweep_state.json liquidity_sweep_log.csv; do
              if [ -f "/tmp/sweep-snapshot/$f" ]; then cp "/tmp/sweep-snapshot/$f" "$f"; fi
            done
            git add -f liquidity_sweep_state.json liquidity_sweep_log.csv 2>/dev/null || true
            if git diff --cached --quiet; then
              echo "No Bot 2 state/history changes to save"
              exit 0
            fi
            git commit -m "Save liquidity sweep bot state"
            if git push origin HEAD:main; then
              echo "Bot 2 state/history saved"
              exit 0
            fi
            git reset --hard origin/main
          done
          echo "Could not save Bot 2 state after retries"
          exit 1
