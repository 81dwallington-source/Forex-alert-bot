name: Fresh Best Bot — historical validation
on:
  workflow_dispatch:
    inputs:
      years:
        description: Historical years to download
        required: true
        type: choice
        options: ["1", "2"]
        default: "1"
      spread_pips:
        description: Assumed full spread in pips
        required: true
        default: "1.2"
permissions:
  contents: read
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install Python dependencies
        run: python -m pip install --upgrade pip pandas pytest
      - name: Run strategy unit tests
        run: python -m pytest best_bot/test_strategy.py -q
      - name: Download and validate Dukascopy history
        run: python download_historical_data.py --years "${{ inputs.years }}" --data-dir historical_data
      - name: Run independent strategy backtest
        run: python best_bot/backtest.py --data-dir historical_data --spread-pips "${{ inputs.spread_pips }}"
      - name: Upload trade ledger
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fresh-best-bot-backtest
          path: best_bot_trades.csv
          if-no-files-found: ignore
