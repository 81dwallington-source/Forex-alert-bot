name: Bot 5 independent strategy research

on:
  push:
    branches:
      - bot5-independent-strategy-lab
    paths:
      - 'bot5/**'
      - 'bot3/**'
      - '.github/workflows/bot5-strategy-research.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: bot5-strategy-research-v2
  cancel-in-progress: true

jobs:
  compete:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bot5-independent-strategy-lab
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Reuse the verified 36-month historical input artifact
        uses: actions/download-artifact@v4
        with:
          name: bot3-research-inputs
          repository: 81dwallington-source/Forex-alert-bot
          run-id: 42768895828
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify all 27 pair files are present
        run: |
          python - <<'PY'
          from pathlib import Path
          pairs = "EURUSD GBPUSD USDJPY USDCHF USDCAD AUDUSD NZDUSD EURGBP EURJPY EURCHF EURAUD EURCAD EURNZD GBPJPY GBPCHF GBPAUD GBPCAD GBPNZD AUDJPY AUDCHF AUDCAD AUDNZD NZDJPY NZDCHF NZDCAD CADJPY CHFJPY".split()
          missing = [p for p in pairs if not (Path("research-data") / f"{p}_M5.csv").is_file()]
          if missing:
              raise SystemExit(f"Shared history artifact is incomplete; missing: {missing}")
          print(f"Verified {len(pairs)} M5 pair files from the existing Bot 3 download")
          PY
      - name: Run Bot 5 predeclared strategy competition
        run: python -m bot5.strategy_competition --data-dir research-data --out-dir research-results/bot5
      - name: Upload Bot 5 reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bot5-strategy-reports
          path: research-results/bot5/
          if-no-files-found: warn
          retention-days: 30
