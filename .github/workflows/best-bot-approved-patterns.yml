name: Best Bot 3 — approved M5 patterns

on:
  pull_request:
    paths:
      - "bot3/**"
      - ".github/workflows/best-bot-approved-patterns.yml"
      - ".github/workflows/best-bot-live.yml"
  push:
    branches: [main]
    paths:
      - "bot3/**"
      - ".github/workflows/best-bot-approved-patterns.yml"
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: best-bot-3-approved-patterns
  cancel-in-progress: false

jobs:
  bot3:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run offline regression tests
        run: python -m unittest -v bot3.test_bot3
      - name: Run 5-minute scans during UK session
        if: github.event_name != 'pull_request'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          cycles=1
          if [ "$GITHUB_EVENT_NAME" = "schedule" ]; then cycles=12; fi
          failures=0
          for cycle in $(seq 1 "$cycles"); do
            echo "Best Bot 3 scan $cycle/$cycles"
            if ! python -m bot3.bot3; then failures=$((failures + 1)); fi
            if [ "$cycle" -lt "$cycles" ]; then sleep 300; fi
          done
          if [ "$failures" -gt 0 ]; then exit 1; fi
      - name: Persist signal log and outcome state
        if: always() && github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bot3_state.json bot3_signal_log.csv 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "Save Best Bot 3 signal state and outcome ledger [skip ci]"
            git push origin HEAD:main
          fi
