name: FVG regression tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [feature/fvg-confluence]

permissions:
  contents: read

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Compile Python files
        run: python -m py_compile Forex_alert.py test_bot.py
      - name: Run offline regression tests
        run: python -m unittest -v test_bot.py
