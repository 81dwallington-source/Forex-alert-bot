name: Bot 3 Historical Backtest

on:
  workflow_dispatch:
    inputs:
      years:
        description: Historical years to download
        required: true
        type: choice
        options:
          - "1"
          - "2"
        default: "1"

permissions:
  contents: read

concurrency:
  group: bot3-historical-backtest
  cancel-in-progress: false

jobs:
  historical-backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Python dependencies
        run: python -m pip install --upgrade pip pandas requests

      - name: Download and validate historical candles
        run: python download_historical_data.py --years "${{ inputs.years }}" --data-dir historical_data

      - name: Run Bot 3 historical backtest
        run: python backtest_bot.py --data-dir historical_data --pairs EUR/USD,GBP/USD,USD/JPY,USD/CHF,USD/CAD,AUD/USD,NZD/USD --spread-pips 1.2

      - name: Upload raw candles and backtest report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bot3-historical-backtest
          path: |
            historical_data/
            backtest_trades.csv
          if-no-files-found: warn
          retention-days: 30
