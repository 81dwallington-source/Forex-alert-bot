name: Forex Alert Bot

on:
  push:
    branches: [main]
    paths-ignore:
      - "signals_state.json"
      - "signal_log.csv"
      - "signal_log_legacy*.csv"
      - "scan_status.txt"
  workflow_dispatch:
  schedule:
    # Sunday forex reopen: run every 5 minutes, offset to avoid the top-of-hour queue.
    - cron: "2-59/5 21-23 * * 0"
    # Weekday scans every 5 minutes, offset to reduce GitHub scheduler congestion.
    - cron: "2-59/5 * * * 1-5"

# Keep only one bot scan active at a time. This protects signal state/history
# from concurrent writes and prevents overlapping scans from sending duplicates.
concurrency:
  group: forex-alert-bot-main
  cancel-in-progress: false

permissions:
  contents: write


jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Get bot code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -c "import requests, pandas; print('All dependencies installed successfully')"

      - name: Run offline regression tests
        run: python -m unittest -v test_bot.py

      - name: Verify Telegram delivery once on this push
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[send-watchlist]')
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import os, requests
          token = os.getenv("TELEGRAM_BOT_TOKEN", "").strip()
          chat_id = os.getenv("TELEGRAM_CHAT_ID", "").strip()
          if not token or not chat_id:
              raise SystemExit("Telegram secrets are missing")
          response = requests.post(
              f"https://api.telegram.org/bot{token}/sendMessage",
              json={"chat_id": chat_id, "text": "👀 ALL FX PAIRS — M5 WATCHLIST\\n\\nScan the full configured forex watchlist: majors and minors (and exotics only if enabled in the bot). Look for institutional-style participation clues, not assumed bank orders.\\n\\nFor any pair, wait for:\\n• M15 and H1 directional confirmation.\\n• M5 pullback towards EMA21.\\n• Strong M5 continuation confirmation candle.\\n• Break of the confirmation candle high for buys, or low for sells.\\n• Fresh live data and acceptable entry distance.\\n\\nNo chasing. No forced trades. No entry, SL or TP until that individual pair has a fully verified setup.\\n\\nWATCHLIST RULES — NOT A TRADE SIGNAL."},
              timeout=20,
          )
          response.raise_for_status()
          result = response.json()
          if not result.get("ok"):
              raise SystemExit(f"Telegram rejected test message: {result}")
          print("Telegram test message accepted by Telegram API")
          PY

      - name: Run forex alert bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python Forex_alert.py

      - name: Publish scan heartbeat
        if: always() && github.ref == 'refs/heads/main'
        continue-on-error: true
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            UTC_NOW="$(date -u '+%Y-%m-%d %H:%M:%S')"
            UK_NOW="$(TZ=Europe/London date '+%Y-%m-%d %H:%M:%S %Z')"
            printf '%s\n' \
              "Last workflow scan (UTC): ${UTC_NOW}" \
              "Last workflow scan (UK): ${UK_NOW}" \
              "Run ID: ${GITHUB_RUN_ID}" \
              "Run number: ${GITHUB_RUN_NUMBER}" \
              "Conclusion: ${{ job.status }}" > scan_status.txt
            git add scan_status.txt
            git commit -m "Update scan heartbeat [skip ci]" || exit 0
            if git push origin HEAD:main; then
              echo "Heartbeat published successfully"
              exit 0
            fi
            echo "Heartbeat push raced with another commit; retrying ($attempt/5)"
            sleep 2
          done
          echo "Heartbeat could not be published after five attempts; bot scan result is unaffected"
          exit 0

      - name: Save signal history safely
        if: always() && github.ref == 'refs/heads/main'
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p /tmp/forex-bot-snapshot
          for file in signals_state.json signal_log.csv signal_log_legacy.csv signal_log_legacy_*.csv; do
            if [ -f "$file" ]; then cp "$file" "/tmp/forex-bot-snapshot/$file"; fi
          done

          for attempt in 1 2 3; do
            echo "Saving signal history (attempt $attempt)"
            git fetch origin main
            git reset --hard origin/main

            python - <<'PY'
          import csv
          import json
          import shutil
          from pathlib import Path

          snap = Path("/tmp/forex-bot-snapshot")
          state_snap = snap / "signals_state.json"
          state_path = Path("signals_state.json")
          if state_snap.exists():
              try:
                  incoming = json.loads(state_snap.read_text(encoding="utf-8"))
                  existing = json.loads(state_path.read_text(encoding="utf-8")) if state_path.exists() else {}
                  if isinstance(existing, dict) and isinstance(incoming, dict):
                      existing.update(incoming)
                      state_path.write_text(json.dumps(existing, indent=2), encoding="utf-8")
              except Exception as exc:
                  print(f"State merge skipped: {exc}")

          snap_log = snap / "signal_log.csv"
          log_path = Path("signal_log.csv")
          if snap_log.exists():
              def read_csv(path):
                  with path.open("r", newline="", encoding="utf-8") as f:
                      reader = csv.DictReader(f)
                      return reader.fieldnames or [], list(reader)

              incoming_header, incoming_rows = read_csv(snap_log)
              current_header, current_rows = read_csv(log_path) if log_path.exists() else ([], [])
              if current_header and incoming_header != current_header:
                  legacy = Path("signal_log_legacy.csv")
                  if legacy.exists():
                      from datetime import datetime, timezone
                      legacy = Path("signal_log_legacy_" + datetime.now(timezone.utc).strftime("%Y%m%d_%H%M%S") + ".csv")
                  shutil.copy2(log_path, legacy)
                  current_header, current_rows = [], []
              if not current_header:
                  current_header = incoming_header
              if current_header == incoming_header:
                  merged = {}
                  for row in current_rows + incoming_rows:
                      key = (row.get("timestamp_utc", ""), row.get("pair", ""), row.get("direction", ""), row.get("candle_time", ""))
                      merged[key] = row
                  with log_path.open("w", newline="", encoding="utf-8") as f:
                      writer = csv.DictWriter(f, fieldnames=incoming_header, extrasaction="ignore")
                      writer.writeheader()
                      writer.writerows(merged.values())

          for legacy_snap in snap.glob("signal_log_legacy*.csv"):
              target = Path(legacy_snap.name)
              if not target.exists():
                  shutil.copy2(legacy_snap, target)

          PY
            git add -f signals_state.json signal_log.csv signal_log_legacy*.csv 2>/dev/null || true
            if git diff --cached --quiet; then
              echo "No signal history changes to commit"
              exit 0
            fi
            git commit -m "Save forex signal history"
            if git push origin HEAD:main; then
              exit 0
            fi
            git reset --hard origin/main
          done
          echo "Could not save signal history after three attempts"
          exit 1
