

name: Forex Alert Bot

on:

  workflow_dispatch:

  schedule:

    - cron: "*/5 * * * 1-5"

permissions:

  contents: write

concurrency:

  group: forex-alert-bot

  cancel-in-progress: false

jobs:

  run-bot:

    runs-on: ubuntu-latest

    timeout-minutes: 10

    steps:

      - name: Get bot code

        uses: actions/checkout@v4

        with:

          fetch-depth: 0

      - name: Set up Python

        uses: actions/setup-python@v5

        with:

          python-version: "3.12"

      - name: Install dependencies

        run: |

          python -m pip install --upgrade pip

          python -m pip install yfinance

          python -c "import yfinance; print('yfinance installed successfully')"

      - name: Run forex alert bot

        env:

          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}

          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

        run: python Forex_alert.py

      - name: Save signal history safely

        run: |

          git config user.name "github-actions[bot]"

          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -f signals_state.json signal_log.csv

          if git diff --cached --quiet; then

            echo "No signal history changes to save."

            exit 0

          fi

          git commit -m "Update Forex signal verification history"

          git fetch origin main

          git rebase origin/main

          git push origin HEAD:main
