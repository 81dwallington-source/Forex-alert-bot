name: Forex Alert Bot

on:

  workflow_dispatch:

  schedule:

    - cron: "*/5 * * * 1-5"

permissions:

  contents: write

concurrency:

  group: forex-alert-bot

  cancel-in-progress: false

jobs:

  run-bot:

    runs-on: ubuntu-latest

    timeout-minutes: 10

    steps:

      - name: Get bot code

        uses: actions/checkout@v4

        with:

          fetch-depth: 0

      - name: Set up Python

        uses: actions/setup-python@v5

        with:

          python-version: "3.12"

      - name: Install dependencies

        run: |

          python -m pip install --upgrade pip

          python -m pip install requests

          python -c "import requests; print('Requests installed successfully')"

      - name: Run forex alert bot

        env:

          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}

          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

        run: python Forex_alert.py

      - name: Save signal history

        if: always() && github.ref == 'refs/heads/main'

        env:

          GH_TOKEN: ${{ github.token }}

        run: |

          git config user.name "github-actions[bot]"

          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ -f signals_state.json ]; then

            git add -f signals_state.json

          fi

          if [ -f signal_log.csv ]; then

            git add -f signal_log.csv

          fi

          if git diff --cached --quiet; then

            echo "No signal history changes to commit"

            exit 0

          fi

          git commit -m "Save forex signal history"

          git pull --rebase origin main

          git push origin HEAD:main
