

name: Forex Alert Bot

on:

  workflow_dispatch:

  schedule:

    - cron: "*/5 * * * 1-5"

permissions:

  contents: write

concurrency:

  group: forex-alert-bot

  cancel-in-progress: false

jobs:

  run-bot:

    runs-on: ubuntu-latest

    timeout-minutes: 10

    steps:

      - name: Get bot code

        uses: actions/checkout@v4

        with:

          fetch-depth: 0

      - name: Set up Python

        uses: actions/setup-python@v5

        with:

          python-version: "3.12"

      - name: Install dependencies

        run: |

          python -m pip install --upgrade pip

          python -m pip install yfinance

          python -c "import yfinance; print('yfinance OK')"

      - name: Run forex alert bot

        env:

          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}

          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

        run: python Forex_alert.py

      - name: Save signal history

        shell: bash

        run: |

          set -e

          git config user.name "github-actions[bot]"

          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -f signals_state.json signal_log.csv

          if git diff --cached --quiet; then

            echo "No history changes to save."

            exit 0

          fi

          git commit -m "Update Forex signal verification history"

          for attempt in 1 2 3; do

            git fetch origin main

            if ! git rebase origin/main; then

              git rebase --abort || true

              echo "Rebase failed; check for conflicting changes."

              exit 1

            fi

            if git push origin HEAD:main; then

              echo "Signal history saved successfully."

              exit 0

            fi

            echo "Push attempt $attempt failed; retrying."

            sleep 2

          done

          echo "Could not save history after 3 attempts."

          exit 1
