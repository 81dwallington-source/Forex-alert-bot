

name: Forex Alert Bot

on:

  workflow_dispatch:

  schedule:

    - cron: "*/5 * * * 1-5"

permissions:

  contents: write

concurrency:

  group: forex-alert-bot

  cancel-in-progress: false

jobs:

  scan-and-verify:

    runs-on: ubuntu-latest

    timeout-minutes: 10

    steps:

      - name: Check out repository

        uses: actions/checkout@v4

        with:

          fetch-depth: 0

      - name: Set up Python

        uses: actions/setup-python@v5

        with:

          python-version: "3.12"

      - name: Install dependencies

        run: python -m pip install --upgrade pip yfinance

      - name: Run scan and verify past signals

        env:

          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}

          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

        run: python forex_alert.py

      - name: Save signal history to GitHub

        run: |

          git config user.name "github-actions[bot]"

          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add signals_state.json signal_log.csv

          if ! git diff --cached --quiet; then

            git commit -m "Update Forex signal verification history"

            git push

          else

            echo "No signal history changes to save."

          fi
