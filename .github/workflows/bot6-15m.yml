name: Bot 6 M5 compression breakout retest scanner

on:
  # Start a long-lived scan session four times daily. Each session scans every
  # five minutes, avoiding reliance on GitHub delivering a separate 5-minute cron.
  schedule:
    - cron: "7 0,6,12,18 * * *"
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/bot6-15m.yml"
      - "bot6/**"

permissions:
  contents: write

concurrency:
  group: bot6-m5-breakout-retest
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check Bot 6 syntax
        run: python -m py_compile bot6/live_bot.py

      - name: Run Bot 6 every five minutes for this session
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        shell: bash
        run: |
          set +e
          for cycle in $(seq 1 70); do
            echo "========== Bot 6 scan $cycle/70 =========="
            python bot6/live_bot.py
            scan_status=$?
            if [ "$scan_status" -ne 0 ]; then
              echo "WARNING: scan $cycle exited with code $scan_status; continuing to next cycle."
            fi

            git add bot6/signals.csv bot6/state.json
            if ! git diff --cached --quiet; then
              git commit -m "Update Bot 6 signal and outcome records [skip ci]"
              pushed=0
              for attempt in 1 2 3; do
                if git pull --rebase origin main && git push; then
                  pushed=1
                  break
                fi
                git rebase --abort >/dev/null 2>&1
                sleep 2
              done
              if [ "$pushed" -ne 1 ]; then
                echo "WARNING: could not push Bot 6 records after three attempts."
              fi
            fi

            if [ "$cycle" -lt 70 ]; then
              sleep 300
            fi
          done
