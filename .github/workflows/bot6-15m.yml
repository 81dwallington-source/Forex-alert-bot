name: Bot 6 M5 compression breakout retest scanner

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/bot6-15m.yml"
      - "bot6/**"

permissions:
  contents: write

concurrency:
  group: bot6-m5-breakout-retest
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check Bot 6 syntax
        run: python -m py_compile bot6/live_bot.py

      - name: Run Bot 6 scan and send Telegram alerts
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python bot6/live_bot.py

      - name: Save Bot 6 trade log and outcome state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bot6/signals.csv bot6/state.json
          if ! git diff --cached --quiet; then
            git commit -m "Update Bot 6 signal and outcome records [skip ci]"
            for attempt in 1 2 3; do
              git pull --rebase origin main
              if git push; then exit 0; fi
              sleep 2
            done
            echo "Could not save Bot 6 records after three push attempts."
            exit 1
          fi
