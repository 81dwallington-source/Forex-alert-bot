name: Bot 6 — PAUSED (manual trigger only)

on:
  # Deliberately paused: no scheduled or push-triggered scans.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  paused:
    runs-on: ubuntu-latest
    steps:
      - name: Confirm Bot 6 is paused
        run: echo "Bot 6 automatic scanning is paused. Do not enable until a replacement passes validation."
