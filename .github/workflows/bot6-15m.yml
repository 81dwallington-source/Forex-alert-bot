name: Bot 6 — live Telegram scanner
# Keep scheduled scans away from GitHub's busiest minute-zero queue.

on:
  push:
    paths:
      - ".github/workflows/bot6-15m.yml"
      - "bot6/live_bot.py"
  workflow_dispatch:
  schedule:
    # UTC: run every fifteen minutes while the FX market is normally open.
    # Mon-Thu all day; Friday until 21:59; Sunday from 22:00.
    - cron: "*/15 * * * 1-4"
    - cron: "*/15 0-21 * * 5"
    - cron: "*/15 22-23 * * 0"

permissions:
  contents: write

concurrency:
  group: bot6-live-scanner
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Bot 6 dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Check Telegram configuration
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "::error::Add TELEGRAM_BOT_TOKEN and TELEGRAM_CHAT_ID under Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Run Bot 6 scan
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python bot6/live_bot.py

      - name: Save Bot 6 trade log and outcome state
        if: always()
        run: |
          mkdir -p bot6/evidence
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A bot6/state.json bot6/signals.csv bot6/evidence
          if ! git diff --cached --quiet; then
            git commit -m "Bot 6: save signal and outcome state"
            git push
          else
            echo "No Bot 6 state or log changes to save."
          fi
