name: Bot 7 Paper Forward Test

on:
  schedule:
    - cron: "7 0,6,12,18 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bot7-paper-forward-test
  cancel-in-progress: false

jobs:
  paper-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Syntax and offline tests
        run: |
          python -m py_compile bot7/live_bot.py
          pytest -q bot7/test_bot7.py
      - name: Run 5-minute paper scans for this session
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          for i in $(seq 1 65); do
            echo "Bot 7 paper scan $i/65"
            python bot7/live_bot.py || echo "Scan failed; continuing next cycle"
            git add bot7/state.json bot7/signals.csv
            git diff --cached --quiet || {
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git commit -m "Update Bot 7 paper forward-test results"
              git push
            }
            if [ "$i" -lt 65 ]; then sleep 300; fi
          done
