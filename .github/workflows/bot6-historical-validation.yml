name: Bot 6 — institutional strategy historical validation

on:
  push:
    paths:
      - "bot6/**"
      - ".github/workflows/bot6-historical-validation.yml"
  workflow_dispatch:
    inputs:
      years:
        description: Historical years to test
        required: true
        type: choice
        options: ["1", "2", "3", "5", "7"]
        default: "7"
      spread_pips:
        description: Assumed full spread in pips
        required: true
        default: "1.2"

permissions:
  contents: read

concurrency:
  group: bot6-historical-validation
  cancel-in-progress: true

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --upgrade pip pandas requests pytest
      - name: Compile Bot 6 and run offline tests
        working-directory: bot6
        run: |
          python -m py_compile live_bot.py backtest.py
          pytest -q
      - name: Download independent Dukascopy history
        env:
          YEARS: ${{ inputs.years || '7' }}
        run: |
          python bot6/download_forexsb_history.py --years "$YEARS" --data-dir historical_data
      - name: Run spread-aware walk-forward backtest
        env:
          SPREAD_PIPS: ${{ inputs.spread_pips || '1.2' }}
        run: |
          cd bot6
          python backtest.py --data-dir ../historical_data --spread-pips "$SPREAD_PIPS" --minimum-oos-trades 30
      - name: Upload trade ledger
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bot6-institutional-backtest
          path: bot6/bot6_backtest_trades.csv
          if-no-files-found: ignore
