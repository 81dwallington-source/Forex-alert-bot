name: Best Bot 3 regression checks

on:
  pull_request:
    branches: [main]
    paths:
      - "best_bot/**"
      - ".github/workflows/best-bot3-regression.yml"
  workflow_dispatch:

jobs:
  strategy-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: python -m pip install pandas pytest
      - name: Run strategy regression tests
        working-directory: best_bot
        run: python -m pytest -q test_strategy.py
