name: Best Bot live scanner

on:
  # Each run stays active for 5h40m and scans every five minutes.
  # Six-hour starts avoid a backlog of overlapping scheduled runs.
  schedule:
    - cron: "0 0,6,12,18 * * 1-5"
    - cron: "0 22 * * 0"
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/best-bot-live.yml"
      - "best_bot/**"
      - "requirements.txt"

permissions:
  contents: write

concurrency:
  group: best-bot-live-scanner
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Check out scanner
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install optional local screenshot vision model
        continue-on-error: true
        run: |
          pip install "moondream==2.6.1"

      - name: Cache local vision model weights
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: best-bot-moondream2-cpu-v1

      - name: Check scanner syntax
        run: python -m py_compile best_bot/strategy.py best_bot/live_bot.py best_bot/run_loop.py best_bot/photo_review.py

      - name: Run strategy regression tests
        run: python -m pytest -q best_bot/test_strategy.py

      - name: Run five-minute scan and Telegram photo listener
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python best_bot/run_loop.py

      - name: Save signal log, outcome state, and Telegram update offset
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add best_bot/live_signals.csv best_bot/live_state.json best_bot/telegram_update_offset.json
          if ! git diff --cached --quiet; then
            git commit -m "Update Best Bot signal, outcome and Telegram inbox state [skip ci]"
            git push
          fi
