name: Best Bot — live M5 scanner

on:
  push:
    paths:
      - ".github/workflows/best-bot-live.yml"
      - "best_bot/live_bot.py"
      - "best_bot/strategy.py"
      - "best_bot/test_live_bot.py"
      - "best_bot/test_strategy.py"
  # Offset away from the busiest minute marks to reduce GitHub schedule delays.
  schedule:
    - cron: "2-59/5 * * * 1-5"
    - cron: "2-59/5 21-23 * * 0"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: best-bot-live-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade pip pandas requests pytest

      - name: Run all strategy and live-bot regression tests
        working-directory: best_bot
        run: python -m pytest -q test_strategy.py test_live_bot.py

      - name: Run live scanner and Telegram alerts
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python best_bot/live_bot.py

      - name: Persist signal log and outcome state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add best_bot/live_state.json best_bot/live_signals.csv 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "Update Best Bot live signal and outcome ledger"
            git pull --rebase origin main
            git push
          fi
