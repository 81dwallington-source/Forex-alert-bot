name: Bot 5 — Trend, Displacement and Pullback Scanner

on:
  # GitHub's schedule can be delayed; the runner itself scans every five minutes
  # for 55 minutes, while this schedule provides the next hand-off opportunity.
  schedule:
    - cron: "2-59/5 * * * *"
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/best-bot-live.yml"
      - "best_bot/**"
      - "requirements.txt"

permissions:
  contents: write

concurrency:
  group: best-bot-five-minute-scan
  # Keep one active scanner and the newest pending run ready to take over.
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - name: Check out scanner
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check scanner syntax
        run: python -m py_compile best_bot/strategy.py best_bot/live_bot.py best_bot/run_loop.py best_bot/photo_review.py

      - name: Run strategy regression tests
        run: python -m pytest -q best_bot/test_strategy.py

      - name: Run continuous five-minute scans and send Telegram alerts
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python best_bot/run_loop.py

      - name: Save signal log, outcome state, and Telegram update offset
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add best_bot/live_signals.csv best_bot/live_state.json best_bot/telegram_update_offset.json
          if ! git diff --cached --quiet; then
            git commit -m "Update Bot 5 signal and outcome state [skip ci]"
            # Other bot workflows can update main while this scan is running.
            # Rebase our small state update onto the latest branch and retry push.
            for attempt in 1 2 3; do
              git pull --rebase origin main
              if git push; then
                exit 0
              fi
              sleep 2
            done
            echo "Could not save Bot 5 state after three push attempts."
            exit 1
          fi
