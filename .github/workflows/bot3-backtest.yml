name: Bot 3 multi-pair historical validation
on:
  push:
    branches: [bot3-independent-build-v2]
    paths:
      - '.github/workflows/bot3-backtest.yml'
      - 'bot3/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  download:
    name: Download ${{ matrix.pair }} M5 history
    runs-on: ubuntu-latest
    timeout-minutes: 210
    strategy:
      fail-fast: false
      max-parallel: 7
      matrix:
        pair: [eurusd, gbpusd, usdjpy, usdchf, usdcad, audusd, nzdusd]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Dukascopy downloader
        run: npm install --no-save dukascopy-node@1.51.1
      - name: Download pair history with retries
        timeout-minutes: 180
        env:
          PAIR: ${{ matrix.pair }}
        run: |
          set -euo pipefail
          mkdir -p data
          for attempt in 1 2 3 4 5 6; do
            rm -f "data/${PAIR}_m5.csv"
            if ./node_modules/.bin/dukascopy-node -i "$PAIR" -from 2024-01-01 -t m5 -f csv -dir data -fn "${PAIR}_m5" --batch-size 5 --batch-pause 2500 --retries 5 --retry-pause 4000 --rate-limit-retries 4 --cache; then
              if test -s "data/${PAIR}_m5.csv"; then
                echo "Downloaded $PAIR: $(wc -c < "data/${PAIR}_m5.csv") bytes"
                break
              fi
            fi
            if [ "$attempt" -eq 6 ]; then echo "ERROR: $PAIR download failed" >&2; exit 1; fi
            sleep $((attempt * 20))
          done
          test -s "data/${PAIR}_m5.csv"
      - uses: actions/upload-artifact@v4
        with:
          name: bot3-data-${{ matrix.pair }}
          path: data/${{ matrix.pair }}_m5.csv
          if-no-files-found: error
          retention-days: 30

  backtest:
    name: Normalize and validate Bot 3
    needs: download
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python dependencies
        run: python -m pip install pandas requests
      - uses: actions/download-artifact@v4
        with:
          pattern: bot3-data-*
          path: data
          merge-multiple: true
      - name: Normalize historical candles
        run: |
          python - <<'PY'
          import pandas as pd
          from pathlib import Path
          for pair in ("EURUSD", "GBPUSD", "USDJPY", "USDCHF", "USDCAD", "AUDUSD", "NZDUSD"):
              source = Path(f"data/{pair.lower()}_m5.csv")
              if not source.exists():
                  raise SystemExit(f"Missing downloaded data: {source}")
              df = pd.read_csv(source)
              if "timestamp" not in df.columns:
                  raise SystemExit(f"{pair}: unexpected Dukascopy columns {list(df.columns)}")
              df["time"] = pd.to_datetime(df["timestamp"], unit="ms", utc=True).astype(str)
              df = df.rename(columns={"open":"Open","high":"High","low":"Low","close":"Close"})
              out = Path(f"data/{pair}_M5_normalized.csv")
              df[["time","Open","High","Low","Close"]].to_csv(out, index=False)
              print(f"{pair}: {len(df):,} M5 candles, {df.time.iloc[0]} to {df.time.iloc[-1]}")
          PY
      - name: Prepare competition input filenames
        run: |
          for pair in EURUSD GBPUSD USDJPY USDCHF USDCAD AUDUSD NZDUSD; do
            cp "data/${pair}_M5_normalized.csv" "data/${pair}_M5.csv"
          done
      - name: Run Bot 3 strategy filter competition (research only)
        timeout-minutes: 180
        run: |
          python -m bot3.strategy_competition --data-dir data --out-dir data/competition --pairs EURUSD,GBPUSD,USDJPY,USDCHF,USDCAD,AUDUSD,NZDUSD --rr 1.0,1.5 --spread-multipliers 1.0,1.5
      - name: Run pair-specific spread sensitivity backtests
        run: |
          set -e
          for pair in EURUSD GBPUSD USDJPY USDCHF USDCAD AUDUSD NZDUSD; do
            for spread in 1.0 1.5; do
              echo "===== ${pair} assumed full spread: ${spread} pips ====="
              python -m bot3.backtest --pair "$pair" --csv "data/${pair}_M5_normalized.csv" --spread-pips "$spread" --slippage-pips 0.2 --out "data/results_${pair}_${spread}pips.csv"
            done
          done
      - name: Report chronological in-sample and unseen out-of-sample results
        run: |
          python - <<'PY'
          import pandas as pd
          from pathlib import Path
          rows = []
          for path in sorted(Path("data").glob("results_*pips.csv")):
              df = pd.read_csv(path)
              if df.empty: continue
              df["signal_time_utc"] = pd.to_datetime(df["signal_time_utc"], utc=True)
              pair = path.name.split("_")[1]
              spread = path.name.split("_")[2].replace("pips.csv", "")
              for label, start, end in [("IN_SAMPLE_2024_2025","2024-01-01","2026-01-01"),("OUT_OF_SAMPLE_2026","2026-01-01","2027-01-01")]:
                  part = df[(df.signal_time_utc >= pd.Timestamp(start,tz="UTC")) & (df.signal_time_utc < pd.Timestamp(end,tz="UTC"))]
                  closed = part[part.outcome.isin(["WIN","LOSS"])]
                  wins = int((closed.outcome=="WIN").sum()); losses = int((closed.outcome=="LOSS").sum())
                  rows.append({"pair":pair,"spread_pips":spread,"period":label,"trades_including_ambiguous":len(part),"wins":wins,"losses":losses,"ambiguous":int((part.outcome=="AMBIGUOUS").sum()),"open_censored":int((part.outcome=="OPEN").sum()),"win_rate_pct":round(100*wins/(wins+losses),2) if wins+losses else None,"net_R":round(float(closed.result_R.sum()),2) if not closed.empty else 0.0})
          report=pd.DataFrame(rows); report.to_csv("data/multi_pair_validation_summary.csv",index=False)
          print(report.to_string(index=False))
          print("\\n2026 remains unseen chronological test data; do not tune rules against it.")
          PY
      - name: Enforce out-of-sample profitability gate
        run: |
          python - <<'PY'
          import pandas as pd
          report=pd.read_csv("data/multi_pair_validation_summary.csv")
          test=report[report.period=="OUT_OF_SAMPLE_2026"]; failures=[]
          for spread in (1.0,1.5):
            part=test[test.spread_pips.astype(float)==spread]
            trades=int(part.trades_including_ambiguous.sum()); wins=int(part.wins.sum()); losses=int(part.losses.sum()); net_r=float(part.net_R.sum())
            win_rate=100*wins/(wins+losses) if wins+losses else 0.0
            print(f"OOS {spread:.1f}-pip spread: {trades} trades, {win_rate:.2f}% wins, {net_r:.2f}R net")
            if trades<30 or net_r<=0: failures.append(f"{spread:.1f}-pip spread failed: trades={trades}, net_R={net_r:.2f}")
          if failures: raise SystemExit("BOT 3 NOT VALIDATED: "+"; ".join(failures))
          print("PASS: both unseen-data spread tests are profitable with at least 30 trades")
          PY
      - name: Upload historical data and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bot3-multi-pair-validation
          path: data/
          retention-days: 30
