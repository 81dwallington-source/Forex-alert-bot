name: Bot 3 historical backtest

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "backtest_bot.py"
      - ".github/workflows/bot3-backtest.yml"

permissions:
  contents: read

jobs:
  historical-backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out Bot 3
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Install Dukascopy historical data downloader
        run: npm install --global dukascopy-node

      - name: Download 2025-2026 M5, M15 and H1 history in quarterly chunks
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p historical_data download
          overall_start=2025-01-01
          overall_end="$(date -u +%Y-%m-%d)"
          for pair in eurusd gbpusd usdjpy usdchf usdcad audusd nzdusd; do
            for tf in m5 m15 h1; do
              echo "Building $pair $tf history: $overall_start to $overall_end"
              combined="historical_data/${pair^^}_${tf^^}.csv"
              : > "$combined"
              header_written=false
              chunk_start="$overall_start"
              while [[ "$chunk_start" < "$overall_end" || "$chunk_start" == "$overall_end" ]]; do
                chunk_end="$(date -u -d "$chunk_start + 3 months - 1 day" +%Y-%m-%d)"
                if [[ "$chunk_end" > "$overall_end" ]]; then chunk_end="$overall_end"; fi
                echo "Downloading $pair $tf: $chunk_start to $chunk_end"
                rm -f download/*
                success=false
                for attempt in 1 2 3; do
                  if dukascopy-node -i "$pair" -from "$chunk_start" -to "$chunk_end" -t "$tf" -f csv -v; then
                    success=true
                    break
                  fi
                  echo "Attempt $attempt failed for $pair $tf $chunk_start; retrying"
                  sleep $((attempt * 5))
                done
                if [[ "$success" != true ]]; then
                  echo "Download failed after 3 attempts: $pair $tf $chunk_start to $chunk_end"
                  exit 1
                fi
                file="$(find download -maxdepth 1 -type f -name "$pair-$tf-bid-*.csv" -print -quit)"
                if [[ -z "$file" ]]; then
                  echo "No CSV produced for $pair $tf $chunk_start to $chunk_end"
                  exit 1
                fi
                if [[ "$header_written" == false ]]; then
                  head -n 1 "$file" > "$combined"
                  header_written=true
                fi
                tail -n +2 "$file" >> "$combined"
                chunk_start="$(date -u -d "$chunk_end + 1 day" +%Y-%m-%d)"
              done
              if [[ "$header_written" != true || ! -s "$combined" ]]; then
                echo "Combined history file is empty: $combined"
                exit 1
              fi
            done
          done

      - name: Run conservative Bot 3 backtest
        run: |
          python -m unittest -v test_bot.py
          python backtest_bot.py --data-dir historical_data --pairs EUR/USD,GBP/USD,USD/JPY,USD/CHF,USD/CAD,AUD/USD,NZD/USD --spread-pips 1.2

      - name: Upload historical data and trade-level results
        uses: actions/upload-artifact@v4
        with:
          name: bot3-historical-backtest-2025-to-current
          path: |
            backtest_trades.csv
            historical_data/
          retention-days: 14
