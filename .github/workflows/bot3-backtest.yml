name: Bot 3 multi-pair historical validation
# Triggered on this branch by workflow-file updates; strategy and Bot 1/2 are untouched.
# Validation rerun after allowing legitimate empty weekend/holiday data.

on:
  push:
    branches:
      - bot3-independent-build-v2
    paths:
      - '.github/workflows/bot3-backtest.yml'
      - 'bot3/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Python and historical-data dependencies
        run: |
          python -m pip install pandas requests
          npm install --no-save dukascopy-node@1.51.1
      - name: Download seven major-pair M5 histories
        timeout-minutes: 180
        run: |
          set -euo pipefail
          mkdir -p data
          download_pair() {
            pair="$1"
            echo "===== Starting ${pair} M5 download ====="
            # M5 requires one request per calendar day. Use small concurrent batches
            # with a 2s pause: serial one-request batches make this 7-pair, 2024-now
            # validation exceed the job timeout. 1.51.1 includes the WAF header fix.
            # Retry request failures; accept legitimate empty weekend/holiday periods. Retain completed periods in cache.
            for attempt in 1 2 3 4 5 6; do
              rm -f "data/${pair}_m5.csv"
              if ./node_modules/.bin/dukascopy-node -i "$pair" -from 2024-01-01 -t m5 -f csv -dir data -fn "${pair}_m5" --batch-size 5 --batch-pause 2000 --retries 5 --retry-pause 3000 --rate-limit-retries 3 --cache; then
                if test -s "data/${pair}_m5.csv"; then
                  echo "===== Finished ${pair}; $(wc -c < "data/${pair}_m5.csv") bytes ====="
                  return 0
                fi
              fi
              echo "Download attempt ${attempt}/6 failed for ${pair}; waiting before retry"
              sleep $((attempt * 20))
            done
            echo "ERROR: Could not download ${pair} after 6 attempts" >&2
            return 1
          }
          # Download sequentially: parallel requests were triggering HTTP 202 responses.
          for pair in eurusd gbpusd usdjpy usdchf usdcad audusd nzdusd; do
            download_pair "$pair"
          done
      - name: Normalize historical candles
        run: |
          python - <<'PY'
          import pandas as pd
          from pathlib import Path
          for pair in ("EURUSD", "GBPUSD", "USDJPY", "USDCHF", "USDCAD", "AUDUSD", "NZDUSD"):
              source = Path(f"data/{pair.lower()}_m5.csv")
              if not source.exists():
                  matches = list(Path("data").glob(f"{pair.lower()}_m5*.csv"))
                  if len(matches) != 1:
                      raise SystemExit(f"Could not identify {pair} CSV: {matches}")
                  source = matches[0]
              df = pd.read_csv(source)
              if "timestamp" not in df.columns:
                  raise SystemExit(f"{pair}: unexpected Dukascopy columns {list(df.columns)}")
              df["time"] = pd.to_datetime(df["timestamp"], unit="ms", utc=True).astype(str)
              df = df.rename(columns={"open":"Open","high":"High","low":"Low","close":"Close"})
              out = Path(f"data/{pair}_M5_normalized.csv")
              df[["time","Open","High","Low","Close"]].to_csv(out, index=False)
              print(f"{pair}: {len(df):,} M5 candles, {df.time.iloc[0]} to {df.time.iloc[-1]}")
          PY
      - name: Run pair-specific spread sensitivity backtests
        run: |
          set -e
          for pair in EURUSD GBPUSD USDJPY USDCHF USDCAD AUDUSD NZDUSD; do
            for spread in 1.0 1.5; do
              echo "===== ${pair} assumed full spread: ${spread} pips ====="
              python -m bot3.backtest --pair "$pair" --csv "data/${pair}_M5_normalized.csv" --spread-pips "$spread" --slippage-pips 0.2 --out "data/results_${pair}_${spread}pips.csv"
            done
          done
      - name: Report chronological in-sample and unseen out-of-sample results
        run: |
          python - <<'PY'
          import pandas as pd
          from pathlib import Path
          rows = []
          for path in sorted(Path("data").glob("results_*pips.csv")):
              df = pd.read_csv(path)
              if df.empty:
                  continue
              df["signal_time_utc"] = pd.to_datetime(df["signal_time_utc"], utc=True)
              pair = path.name.split("_")[1]
              spread = path.name.split("_")[2].replace("pips.csv", "")
              for label, start, end in [
                  ("IN_SAMPLE_2024_2025", "2024-01-01", "2026-01-01"),
                  ("OUT_OF_SAMPLE_2026", "2026-01-01", "2027-01-01"),
              ]:
                  part = df[(df.signal_time_utc >= pd.Timestamp(start, tz="UTC")) &
                            (df.signal_time_utc < pd.Timestamp(end, tz="UTC"))]
                  closed = part[part.outcome.isin(["WIN", "LOSS"])]
                  wins = int((closed.outcome == "WIN").sum())
                  losses = int((closed.outcome == "LOSS").sum())
                  rows.append({
                      "pair": pair, "spread_pips": spread, "period": label,
                      "trades_including_ambiguous": len(part),
                      "wins": wins, "losses": losses,
                      "ambiguous": int((part.outcome == "AMBIGUOUS").sum()),
                      "open_censored": int((part.outcome == "OPEN").sum()),
                      "win_rate_pct": round(100*wins/(wins+losses), 2) if wins+losses else None,
                      "net_R": round(float(closed.result_R.sum()), 2) if not closed.empty else 0.0,
                  })
          report = pd.DataFrame(rows)
          report.to_csv("data/multi_pair_validation_summary.csv", index=False)
          print(report.to_string(index=False))
          print("\n2026 remains the unseen chronological test period. Do not tune rules against it.")
          PY
      - name: Upload historical data and results
        uses: actions/upload-artifact@v4
        with:
          name: bot3-multi-pair-validation
          path: data/
          retention-days: 30
