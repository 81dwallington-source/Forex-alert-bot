name: Bot 1 — H1 Pullback M5 Mini BOS

on:
  # One long-lived worker covers almost six hours; the next run restarts it.
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/bot1-h1-pullback.yml"
      - "bot1/worker.py"

permissions:
  contents: write

concurrency:
  group: bot1-h1-pullback-live
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install requests pandas pytest
      - name: Validate Bot 1
        run: |
          python -m py_compile bot1/live_bot.py bot1/worker.py
          cd bot1 && pytest -q
      - name: Scan pairs and send Telegram alerts every five minutes
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python bot1/worker.py
      - name: Save Bot 1 state and signal log
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bot1/state.json bot1/signals.csv
          if ! git diff --cached --quiet; then
            git commit -m "Bot 1: save scan state and signal log"
            git push
          else
            echo "No Bot 1 state changes."
          fi
